<!DOCTYPE html>
<html lang="en">
<head>
    <title>KisanMitra AI 🌾</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f9f4; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2e7d32; margin-bottom: 5px; }
        .logo { font-size: 60px; display: block; margin-bottom: 10px; }
        
        /* Input Groups */
        .input-group { margin: 20px 0; text-align: left; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #444; }
        input[type="file"], select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        
        /* Voice Box */
        .voice-box { display: flex; gap: 10px; }
        .mic-btn { background: #ff9800; border: none; color: white; padding: 0 20px; border-radius: 8px; cursor: pointer; font-size: 20px; transition: 0.3s; }
        
        /* --- NEW: Active Listening Style (Red + Pulse) --- */
        .mic-active {
            background-color: #f44336 !important; /* Red color */
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(244, 67, 54, 0); }
            100% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0); }
        }
        
        /* Action Buttons */
        .btn-row { display: flex; gap: 10px; margin-top: 5px; }
        .camera-btn { flex: 1; background: #2196F3; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .camera-btn:hover { background: #1976D2; }
        
        /* Submit Button */
        .submit-btn { background: #2e7d32; color: white; border: none; padding: 15px; width: 100%; border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        .submit-btn:hover { background: #1b5e20; transform: scale(1.02); }

        /* --- UPDATED: Breathing Loading Overlay --- */
        
        /* --- BREATHE LOADER (Inhale/Exhale) --- */
       #loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.98); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; }
        
        .breathing-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: breathe 2s ease-in-out infinite;
        }
        
        @keyframes breathe {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        /* Camera Modal */
        #camera-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 2000; flex-direction: column; align-items: center; justify-content: center; }
        #camera-feed { width: 100%; max-width: 600px; height: auto; border-radius: 10px; }
        .camera-controls { margin-top: 20px; display: flex; gap: 20px; }
        .snap-btn { background: white; border: 5px solid #ddd; width: 60px; height: 60px; border-radius: 50%; cursor: pointer; }
        .close-camera { position: absolute; top: 20px; right: 20px; color: white; font-size: 30px; cursor: pointer; }
    </style>
</head>
<body>

<div id="loading-overlay">
    <div class="breathing-icon">🌾</div>
    <h3 style="color: #2e7d32; margin-top: 10px;">Analyzing Crop Health...</h3>
    <p>Please wait while KisanMitra AI diagnoses the issue.</p>
</div>

<div id="camera-modal">
    <span class="close-camera" onclick="stopCamera()">&times;</span>
    <video id="camera-feed" autoplay playsinline></video>
    <canvas id="camera-canvas" style="display:none;"></canvas>
    <div class="camera-controls">
        <button class="snap-btn" onclick="takeSnapshot()"></button>
    </div>
    <p style="color: white; margin-top: 10px;">Click circle to capture</p>
</div>

<div class="container">
    <div class="logo">🌾</div>
    <h1>KisanMitra AI</h1>
    <p style="color: #666;">Your Personal Plant Doctor</p>

    <form id="diagnoseForm">
        <div class="input-group">
            <label><i class="fas fa-language"></i> Language (भाषा):</label>
            <select name="language" id="language">
                <option value="Hindi">Hindi (हिंदी)</option>
                <option value="English">English</option>
                <option value="Marathi">Marathi (मराठी)</option>
                <option value="Tamil">Tamil (தமிழ்)</option>
                <option value="Gujarati">Gujarati (ગુજરાતી)</option>
                <option value="Kannada">Kannada (ಕನ್ನಡ)</option>
                <option value="Telugu">Telugu (తెలుగు)</option>
                <option value="Bengali">Bengali (বাংলা)</option>
                <option value="Punjabi">Punjabi (ਪੰਜਾਬੀ)</option>
                <option value="Malayalam">Malayalam (മലയാളം)</option>
                <option value="Odia">Odia (ଓଡ଼ିଆ)</option>
                <option value="Assamese">Assamese (অসমীয়া)</option>
                <option value="Rajasthani">Rajasthani (राजस्थानी)</option>
                <option value="Kashmiri">Kashmiri (کٲشمی)</option>
            </select>
        </div>

        <div class="input-group">
            <label><i class="fas fa-camera"></i> Upload Photo (फोटो लें):</label>
            
            <input type="file" name="image" id="fileInput" accept="image/*" onchange="previewImage(event)">
            
            <div class="btn-row">
                <button type="button" class="camera-btn" onclick="startCamera()">
                    <i class="fas fa-camera"></i> Use Camera
                </button>
            </div>

            <img id="imgPreview" style="display:none; width: 100%; margin-top: 10px; border-radius: 10px; border: 2px solid #eee;">
        </div>

        <div class="input-group">
            <label><i class="fas fa-comment-medical"></i> Describe Issue (समस्या बताएं):</label>
            <div class="voice-box">
                <textarea name="query" id="queryBox" placeholder="Optional: E.g., 'Leaves are turning yellow'"></textarea>
                <button type="button" class="mic-btn" id="micBtn" onclick="startDictation()">🎤</button>
            </div>
        </div>

        <button type="submit" class="submit-btn">Get Diagnosis Report (रिपोर्ट देखें)</button>
    </form>
</div>

<script>
    // --- 1. Form Submission (Handles JSON Redirect) ---
    document.getElementById('diagnoseForm').onsubmit = async function(e) {
        e.preventDefault();
        
        let fileInput = document.getElementById('fileInput');
        if (!fileInput.files.length) {
            alert("Please select or capture an image first!");
            return;
        }

        document.getElementById('loading-overlay').style.display = 'flex';
        
        var formData = new FormData(this);

        try {
            let response = await fetch('/diagnose', {
                method: 'POST',
                body: formData
            });

            let data = await response.json();

            if (data.status === 'success' && data.redirect_url) {
                window.location.href = data.redirect_url;
            } else {
                document.getElementById('loading-overlay').style.display = 'none';
                alert("Error: " + (data.error || "Unknown error"));
            }
        } catch (error) {
            console.error('Error:', error);
            document.getElementById('loading-overlay').style.display = 'none';
            alert("Something went wrong with the server connection.");
        }
    };

    // --- 2. Camera Logic ---
    let videoStream = null;

    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment" } 
            });
            videoStream = stream;
            
            const video = document.getElementById('camera-feed');
            video.srcObject = stream;
            
            document.getElementById('camera-modal').style.display = 'flex';
        } catch (err) {
            alert("Could not access camera: " + err);
        }
    }

    function stopCamera() {
        if (videoStream) {
            videoStream.getTracks().forEach(track => track.stop());
            videoStream = null;
        }
        document.getElementById('camera-modal').style.display = 'none';
    }

    function takeSnapshot() {
        const video = document.getElementById('camera-feed');
        const canvas = document.getElementById('camera-canvas');
        const context = canvas.getContext('2d');

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        canvas.toBlob((blob) => {
            const file = new File([blob], "camera_capture.jpg", { type: "image/jpeg" });
            
            const dataTransfer = new DataTransfer();
            dataTransfer.items.add(file);
            document.getElementById('fileInput').files = dataTransfer.files;

            const preview = document.getElementById('imgPreview');
            preview.src = URL.createObjectURL(file);
            preview.style.display = 'block';

            stopCamera();
        }, 'image/jpeg');
    }

    function previewImage(event) {
        var output = document.getElementById('imgPreview');
        if (event.target.files && event.target.files[0]) {
            output.src = URL.createObjectURL(event.target.files[0]);
            output.style.display = 'block';
        }
    }

    // --- 3. Voice Logic (UPDATED: Adds Red 'Listening' Effect) ---
    function startDictation() {
        if (window.hasOwnProperty('webkitSpeechRecognition')) {
            var recognition = new webkitSpeechRecognition();
            var langCodes = {'Hindi': 'hi-IN', 'English': 'en-US', 'Marathi': 'mr-IN', 'Gujarati': 'gu-IN', 'Tamil': 'ta-IN', 'Kannada': 'kn-IN', 'Telugu': 'te-IN', 'Bengali': 'bn-IN', 'Punjabi': 'pa-IN', 'Malayalam': 'ml-IN', 'Odia': 'or-IN', 'Assamese': 'as-IN','Rajasthani': 'hi-IN', 'Kashmiri': 'ks-IN'};
            recognition.lang = langCodes[document.getElementById('language').value] || 'en-US';
            
            var micBtn = document.getElementById('micBtn');

            // START: Turn Red & Pulse
            recognition.onstart = function() {
                micBtn.classList.add('mic-active');
            };

            recognition.onresult = function(e) {
                document.getElementById('queryBox').value = e.results[0][0].transcript;
                micBtn.classList.remove('mic-active'); // Stop Red Effect
            };

            recognition.onerror = function(e) {
                micBtn.classList.remove('mic-active'); // Stop Red Effect on error
            };

            recognition.onend = function() {
                micBtn.classList.remove('mic-active'); // Stop Red Effect when done
            };

            recognition.start();
        } else {
            alert("Voice input requires Chrome browser.");
        }
    }
</script>
<p>&copy; 2026 KisanMitra AI. All Rights Reserved.</p>
</body>
</html>
