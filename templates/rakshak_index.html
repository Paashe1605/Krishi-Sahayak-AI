<!DOCTYPE html>
<html lang="en">
<head>
    <title>Krishi Rakshak AI 🛡️</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f4f8; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #1565c0; margin-bottom: 5px; }
        .custom-icon { font-size: 60px; color: #1565c0; display: block; margin-bottom: 10px; }
        .input-group { margin: 20px 0; text-align: left; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #444; }
        input[type="file"], select, input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .submit-btn { background: #ffb300; color: #1565c0; border: none; padding: 15px; width: 100%; border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        .submit-btn:hover { background: #ffc107; }
        #loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(240, 244, 248, 0.95); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; }
        .breathing-icon { font-size: 80px; margin-bottom: 20px; animation: breathe 2s ease-in-out infinite; color: #1565c0; }
        @keyframes breathe { 0% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); opacity: 0.8; } }
    </style>
    <script src="/static/js/translations.js"></script>
</head>
<body>
{% include 'navbar.html' %}
<div id="loading-overlay">
    <div class="breathing-icon"><i class="fa-solid fa-shield-alt custom-icon"></i></div>
    <h3 style="color: #1565c0; margin-top: 10px;" data-i18n="load_title_rakshak">Analyzing Financial Risk & Insurance...</h3>
    <p data-i18n="load_desc_rakshak">Please wait while Krishi Rakshak assesses the report.</p>
</div>
<div class="container">
    <div class="logo"><i class="fa-solid fa-shield-alt custom-icon"></i></div>
    <h1>Krishi Rakshak</h1>
    <p style="color: #666;" data-i18n="rakshak_desc">Your Financial & Insurance Advisor</p>
    <form id="diagnoseForm" action="/diagnose_rakshak" enctype="multipart/form-data">
        <input type="hidden" name="lat" id="latInput">
        <input type="hidden" name="lng" id="lngInput">
        <div class="input-group">
            <label><i class="fas fa-language"></i> <span data-i18n="lang_label">Language (भाषा)</span>:</label>
            <select name="language" id="language" onchange="saveLanguageSettings()">
                <option value="hi">Hindi (हिंदी)</option>
                <option value="en">English</option>
                <option value="mr">Marathi (मराठी)</option>
                <option value="ta">Tamil (தமிழ்)</option>
                <option value="gu">Gujarati (ગુજરાતી)</option>
                <option value="pa">Punjabi (ਪੰਜਾਬੀ)</option>
                <option value="bn">Bengali (বাংলা)</option>
                <option value="te">Telugu (తెలుగు)</option>
                <option value="kn">Kannada (ಕನ್ನಡ)</option>
                <option value="ml">Malayalam (മലയാളം)</option>
            </select>
        </div>
        <div class="input-group">
            <label><i class="fas fa-map-marker-alt"></i> <span data-i18n="loc_label">Location (State/Region)</span>:</label>
            <input type="text" name="location" id="location" placeholder="E.g., Anand, Gujarat" data-i18n-placeholder="loc_placeholder" required>
        </div>
        <div class="input-group">
            <label><i class="fas fa-file-pdf"></i> <span data-i18n="upload_rakshak">Upload Diagnosis Report (PDF/Image)</span>:</label>
            <input type="file" name="image" id="fileInput" accept=".pdf,image/*" onchange="previewFile(event)">
            <p id="fileNamePreview" style="display:none; color: #1565c0; font-weight: bold; margin-top: 10px;"></p>
            <img id="imgPreview" style="display:none; width: 100%; margin-top: 10px; border-radius: 10px; border: 2px solid #eee;">
        </div>
        <button type="submit" class="submit-btn" data-i18n="btn_report">Get Analysis Report</button>
    </form>
</div>
<script>
    function applyTranslations(langCode) {
        if (!krishiTranslations || !krishiTranslations[langCode]) return;
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (krishiTranslations[langCode][key]) el.innerText = krishiTranslations[langCode][key];
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            const key = el.getAttribute('data-i18n-placeholder');
            if (krishiTranslations[langCode][key]) el.placeholder = krishiTranslations[langCode][key];
        });
    }

    function saveLanguageSettings() {
        const lang = document.getElementById('language').value;
        localStorage.setItem('krishi_lang', lang);
        applyTranslations(lang);
    }

    document.addEventListener('DOMContentLoaded', () => {
        const savedLang = localStorage.getItem('krishi_lang');
        if (savedLang) {
            const langSelect = document.getElementById('language');
            if (langSelect) langSelect.value = savedLang;
            applyTranslations(savedLang);
        }
        const savedLat = localStorage.getItem('krishi_lat');
        const savedLng = localStorage.getItem('krishi_lng');
        const savedLocText = localStorage.getItem('krishi_loc_text');
        
        if (savedLocText) {
            const locInput = document.getElementById('location');
            if (locInput) locInput.value = savedLocText;
        }

        if (savedLat && savedLng) {
            document.getElementById('latInput').value = savedLat;
            document.getElementById('lngInput').value = savedLng;
        }
    });

    document.getElementById('diagnoseForm').onsubmit = async function(e) {
        e.preventDefault();
        let fileInput = document.getElementById('fileInput');
        if (!fileInput.files.length) { alert("Please select a file first!"); return; }
        document.getElementById('loading-overlay').style.display = 'flex';
        
        if (!document.getElementById('latInput').value) {
            let getGeo = () => new Promise((resolve) => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => resolve({lat: pos.coords.latitude, lng: pos.coords.longitude}),
                        (err) => resolve(null), { timeout: 5000 }
                    );
                } else { resolve(null); }
            });
            
            let geo = await getGeo();
            if (geo) {
                document.getElementById('latInput').value = geo.lat;
                document.getElementById('lngInput').value = geo.lng;
            }
        }

        var formData = new FormData(this);
        
        const langMap = { "hi": "Hindi", "en": "English", "mr": "Marathi", "ta": "Tamil", "gu": "Gujarati", "pa": "Punjabi", "bn": "Bengali", "te": "Telugu", "kn": "Kannada", "ml": "Malayalam" };
        const shortCode = document.getElementById('language').value;
        formData.set('language', langMap[shortCode] || "Hindi");

        try {
            let response = await fetch('/diagnose_rakshak', { method: 'POST', body: formData });
            let data = await response.json();
            if (data.status === 'success' && data.redirect_url) { window.location.href = data.redirect_url; }
            else { document.getElementById('loading-overlay').style.display = 'none'; alert("Error: " + (data.error || "Unknown error")); }
        } catch (error) { document.getElementById('loading-overlay').style.display = 'none'; alert("Something went wrong with the server connection."); }
    };

    function previewFile(event) { 
        if (event.target.files[0]) { 
            const file = event.target.files[0];
            const isImage = file.type.startsWith('image/');
            if (isImage) {
                document.getElementById('imgPreview').src = URL.createObjectURL(file); 
                document.getElementById('imgPreview').style.display = 'block'; 
                document.getElementById('fileNamePreview').style.display = 'none';
            } else {
                document.getElementById('imgPreview').style.display = 'none'; 
                document.getElementById('fileNamePreview').innerText = "📄 " + file.name;
                document.getElementById('fileNamePreview').style.display = 'block';
            }
        } 
    }
</script>
<p style="text-align:center; font-size:0.8em; color:#888; margin-top:20px;">
        © 2026 Paaras Shemrudkar & Prachi Sharma (Owners of Krishi Shayak AI). All rights reserved.</p>
</body>
</html>
