<!DOCTYPE html>
<html lang="en">
<head>
    <title>{{ title }} - Coming Soon</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f9f4; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: auto; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-top: 10vh; }
        h1 { color: #2e7d32; margin-bottom: 10px; font-size: 2em; }
        .logo { font-size: 60px; display: block; margin-bottom: 10px; }
        p { color: #666; font-size: 1.1em; line-height: 1.5; margin-bottom: 30px; }
        .back-btn { display: inline-block; background: #2e7d32; color: white; padding: 12px 30px; border-radius: 50px; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .back-btn:hover { background: #1b5e20; box-shadow: 0 4px 10px rgba(46, 125, 50, 0.3); transform: translateY(-2px); }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">🚧</div>
    <h1>{{ title }}</h1>
    <p>We are currently building this detailed feature.<br>Stay tuned for updates!</p>
    <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Home</a>
</div>
</body>
</html>
